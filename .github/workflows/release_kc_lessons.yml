name: Release lesson with tagged versions that uses tag format lessonXvX.Y.Z

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release-lesson-version:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find previous tag
        id: prev
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)
          echo "prev_tag=$PREV" >> "$GITHUB_OUTPUT"
          echo "Comparing from: ${PREV:-<initial commit>}"

      - name: Generate release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV="${{ steps.prev.outputs.prev_tag }}"
          {
            if [ -n "$PREV" ]; then
              echo "## Changes since \`${PREV}\`"
            else
              echo "## ${TAG} — initial release"
            fi
            echo ""
            echo "### Commits"
            if [ -n "$PREV" ]; then
              git log "${PREV}..HEAD" --oneline --no-merges | sed 's/^/- /'
            else
              git log HEAD --oneline --no-merges | sed 's/^/- /'
            fi
            echo ""
            echo "### Files"
            if [ -n "$PREV" ]; then
              git diff --name-only "${PREV}..HEAD" | sed "s|^|- \`|" | sed "s|$|\`|"
            else
              git diff --name-only $(git rev-list --max-parents=0 HEAD)..HEAD \
                | sed "s|^|- \`|" | sed "s|$|\`|"
            fi
          } > /tmp/release_notes.md
          cat /tmp/release_notes.md

      - name: Package changed files
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV="${{ steps.prev.outputs.prev_tag }}"
          if [ -n "$PREV" ]; then
            CHANGED=$(git diff --name-only "${PREV}..HEAD")
          else
            CHANGED=$(git diff --name-only $(git rev-list --max-parents=0 HEAD)..HEAD)
          fi
          echo "$CHANGED" | zip -r "${TAG}.zip" -@
          echo "Packaged: ${TAG}.zip ($(du -sh "${TAG}.zip" | cut -f1))"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          body_path: /tmp/release_notes.md
          files: ${{ github.ref_name }}.zip
          make_latest: false
